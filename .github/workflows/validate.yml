name: Validar código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar sintaxe PowerShell
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { throw 'Há erros de sintaxe PowerShell.' }

      - name: Validar XAML
        shell: powershell
        run: |
          [xml](Get-Content -LiteralPath .\UI\MainWindow.xaml -Raw) | Out-Null

      - name: Impedir dados locais no repositório
        shell: powershell
        run: |
          # Os termos são montados em runtime para o workflow não encontrar a própria regra.
          $privateTerms = @(
            ('Emanuel' + 'PereiraFraga'),
            ('Drive' + ' Pessoal'),
            ('Teste' + ' Organizador'),
            ('AppData' + '\\Roaming\\Pioneer')
          )
          $patterns = ($privateTerms | ForEach-Object { [regex]::Escape($_) }) -join '|'
          $textExtensions = '.ps1','.psm1','.md','.json','.yml','.yaml','.xaml','.cs','.py','.cmd','.vbs','.txt','.svg'
          $ignoredRuntimeFolders = '[\\/](?:\.git|Cache|DownloadLogs|Exports|History|Logs|Backups|Reports|lib|ODT-RekordboxDirect)[\\/]'
          $files = Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch $ignoredRuntimeFolders -and
            ($textExtensions -contains $_.Extension -or $_.Name -eq '.gitignore')
          }
          $hits = $files | Select-String -Pattern $patterns -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line)" }
            throw 'O repositório contém caminhos locais.'
          }
