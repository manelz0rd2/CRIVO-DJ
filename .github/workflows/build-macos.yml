name: Build CRIVO DJ for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package: Apple-Silicon
          - runner: macos-15-intel
            package: Intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macos/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pytest pyinstaller
      - name: Testar o porte
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Montar CRIVO DJ.app
        run: bash scripts/build_macos.sh
      - name: Assinatura ad hoc e pacote
        run: |
          codesign --force --deep --sign - "dist/CRIVO DJ.app"
          codesign --verify --deep --strict --verbose=2 "dist/CRIVO DJ.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/CRIVO DJ.app" "dist/CRIVO-DJ-macOS-${{ matrix.package }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CRIVO-DJ-macOS-${{ matrix.package }}
          path: macos/dist/CRIVO-DJ-macOS-${{ matrix.package }}.zip
          if-no-files-found: error
          compression-level: 0

